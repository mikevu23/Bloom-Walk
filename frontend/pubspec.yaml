name: bloomwalk
description: "8-bit therapeutic flower collecting mobile app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: ^2.0.0
  http: ^1.2.0
  table_calendar: ^3.1.0
  google_fonts: ^6.2.0
  geolocator: ^11.0.0
  pedometer: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/fonts/
